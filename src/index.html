<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>CoilEdit</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div id="side-head">
        <span id="side-title">Open Files</span>
        <span id="tab-count"></span>
        <span class="spacer"></span>
        <button id="btn-group" class="icon-btn" title="Group by folder (Ctrl+Shift+G)">
          <svg viewBox="0 0 16 16"><path d="M2.5 3h4M5 3v9.5h3M5 7.5h3M10 7.5h4M10 12.5h4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button id="btn-open" class="icon-btn" title="Open file (Ctrl+O)">
          <svg viewBox="0 0 16 16"><path d="M1.5 3.5h4l1.5 1.5h7.5v8h-13z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>
        </button>
        <button id="btn-new" class="icon-btn" title="New file (Ctrl+N)">
          <svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div id="tabs"></div>
    </aside>
    <div id="resizer"></div>
    <main id="main">
      <div id="editor"></div>
      <div id="empty" hidden>
        <div class="empty-inner">
          <div class="empty-title">No files open</div>
          <div class="keys">
            <span><kbd>Ctrl</kbd><kbd>N</kbd></span><span>New file</span>
            <span><kbd>Ctrl</kbd><kbd>O</kbd></span><span>Open file</span>
            <span><kbd>Ctrl</kbd><kbd>R</kbd></span><span>Recent files</span>
            <span><kbd>Ctrl</kbd><kbd>P</kbd></span><span>Jump to tab</span>
          </div>
          <div class="empty-hint">or drop files anywhere in this window</div>
        </div>
      </div>
    </main>
    <footer id="status">
      <span id="st-path" class="st" title="Click to copy path"></span>
      <span class="spacer"></span>
      <span id="st-pos" class="st"></span>
      <span id="st-indent" class="st click" title="Indentation"></span>
      <span id="st-enc" class="st click" title="Encoding"></span>
      <span id="st-eol" class="st click" title="Line endings (click to toggle)"></span>
      <span id="st-lang" class="st click" title="Language (Ctrl+Alt+L)"></span>
    </footer>
  </div>

  <div id="qp" hidden>
    <div id="qp-box">
      <input id="qp-input" spellcheck="false" autocomplete="off">
      <div id="qp-list"></div>
    </div>
  </div>

  <script src="../node_modules/monaco-editor/min/vs/loader.js"></script>
  <script src="recoil.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
